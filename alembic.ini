# Configuración de Alembic.
#
# `sqlalchemy.url` no aparece aquí a propósito: la resuelve `env.py` desde la
# configuración de la aplicación, para que la cadena de conexión viva en una
# sola fuente y no haya que repetir un secreto en un archivo versionado.

[alembic]
script_location = alembic
prepend_sys_path = src
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
