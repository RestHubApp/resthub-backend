[project]
name = "resthub-backend"
version = "0.1.0"
description = "Backend hexagonal de RestHub, gestión de restaurantes pequeños"
requires-python = ">=3.12,<3.15"
# `tzdata` trae la base de zonas horarias de IANA: `zoneinfo` la usa cuando el
# sistema no la tiene, como en Windows o en imágenes de contenedor mínimas.
dependencies = [
    "aiosqlite==0.22.1",
    "alembic==1.19.2",
    "asyncpg==0.31.0",
    "bcrypt==5.0.0",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "pydantic[email]==2.13.5",
    "pydantic-settings==2.15.0",
    "pyjwt==2.15.1",
    "sqlalchemy==2.0.52",
    "structlog==26.1.0",
    "tzdata==2026.4",
    "uvicorn[standard]==0.52.4",
]

[dependency-groups]
chaos = [
    "chaostoolkit>=1.20.0",
    "chaostoolkit-lib>=1.45.0",
    "playwright>=1.63.0",
]
dev = [
    "import-linter>=2.15",
    "mypy>=2.4",
    "pyspellchecker>=0.9.1",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.16,<0.17",
]
# Cobertura de código. Va aparte de `dev` para no alargar el CI:
# `uv run --group coverage pytest --cov=resthub --cov-report=term-missing`.
coverage = [
    "pytest-cov>=7.0",
]
# Pruebas de mutación (mutmut 3). Lentas: no corren en el CI de cada push.
# `uv run --group mutation mutmut run --max-children 3`.
mutation = [
    "mutmut>=3.3",
]
# Verificación del contrato con el frontend (Pact). Grupo aparte para no
# alargar el CI de las pruebas comunes: lo instala solo su job.
contract = [
    "pact-python>=3.4",
]
# Análisis estático de seguridad y de dependencias; lo usa el job `seguridad`
# del CI. Semgrep no va aquí: fija versiones propias de varias librerías, así
# que corre aparte con `uvx`.
security = [
    "bandit[toml]>=1.9",
    "pip-audit>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resthub"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
# Un aviso es un fallo. Es la forma barata de enterarse de una deprecación
# cuando todavía queda una versión de margen para atenderla.
filterwarnings = ["error"]

# SQLAlchemy asíncrono ejecuta las consultas en greenlets: sin `greenlet` en
# `concurrency`, coverage.py deja de registrar las líneas que siguen a un
# `await` sobre la base aunque sí se ejecuten, y la cobertura sale subestimada.
[tool.coverage.run]
source = ["resthub"]
branch = true
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
# Medido: 96,9 % de ramas. El piso va redondeado hacia abajo; súbelo cuando la
# cobertura suba, nunca lo bajes para que pase un cambio.
fail_under = 96
precision = 1
show_missing = true
skip_covered = true

[tool.coverage.html]
directory = "htmlcov"

# Pruebas de mutación con mutmut 3: `uv run --group mutation mutmut run --max-children 3`.
# El alcance son las reglas de negocio puras (`domain` y `use_cases`) de los
# módulos con reglas críticas y la lógica de permisos; los adaptadores (HTTP y
# SQLAlchemy) quedan fuera porque sus mutantes se prueban mejor con las pruebas
# de integración y multiplican el tiempo sin medir reglas del negocio.
[tool.mutmut]
source_paths = ["src/"]
only_mutate = [
    "src/resthub/modules/orders/domain/*",
    "src/resthub/modules/orders/use_cases/*",
    "src/resthub/modules/billing/domain/*",
    "src/resthub/modules/billing/use_cases/*",
    "src/resthub/modules/inventory/domain/*",
    "src/resthub/modules/inventory/use_cases/*",
    "src/resthub/modules/accounts/domain/*",
    "src/resthub/modules/accounts/use_cases/*",
    "src/resthub/core/permissions.py",
]
also_copy = ["alembic/", "alembic.ini", "scripts/"]
pytest_add_cli_args = ["-p", "no:cacheprovider"]

# Bandit revisa el código que se ejecuta (`src` y `scripts`). Las pruebas quedan
# fuera: usan `assert` y credenciales de mentira por diseño. Ninguna regla se
# omite de forma global; cada falso positivo lleva `# nosec BXXX` en su línea.
[tool.bandit]
exclude_dirs = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
# Se activan todas las reglas de Ruff (`ALL`) y se descartan por nombre las que no
# aplican, cada una con su motivo. Una regla nueva de una versión futura de Ruff
# entra sola; por eso Ruff está fijado a `<0.17` en el grupo `dev`.
select = ["ALL"]
ignore = [
    # Presencia de docstring (D100-D107): decisión deliberada del equipo. Obligar a
    # documentar cada módulo y cada función produce la línea que repite el nombre
    # del archivo; aquí un docstring es opcional y, cuando existe, las reglas de
    # forma (D2xx, D3xx, D4xx) sí lo revisan.
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",
    # Parejas de reglas D incompatibles entre sí: se queda D211 (sin línea en blanco
    # antes de la clase) y D212 (resumen en la primera línea).
    "D203", "D213",
    # Chocan con `ruff format`, que ya decide las comas finales y las cadenas.
    "COM812", "ISC001",
    # Aviso de copyright: el proyecto no pone cabecera de licencia en cada archivo.
    "CPY001",
    # Mover importaciones a `if TYPE_CHECKING:` rompe Pydantic, FastAPI y SQLAlchemy,
    # que resuelven las anotaciones en tiempo de ejecución (modelos, `Depends`,
    # `Mapped[...]`). Mypy ya vigila las importaciones sin uso real.
    "TC001", "TC002", "TC003",
]

# Las reglas de seguridad `S` se apagan en las pruebas solo en tres puntos, por su
# naturaleza: pytest verifica con `assert` (S101) y las pruebas usan contraseñas y
# claves de mentira a propósito (S105, S106). Fuera de `tests/` todo falso positivo
# se suprime en su línea y con su motivo.
[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "ARG",      # las fixtures de pytest se piden por su efecto, no por su valor
    "S101",     # pytest verifica con `assert`
    "S105",     # contraseñas de mentira a propósito
    "S106",
    "PLR2004",  # un número literal en una aserción es el valor esperado, no un número mágico
    "SLF001",   # una prueba mira el estado interno que la API pública no expone
    "PLR0913",  # los constructores de datos de prueba (`builders`) admiten muchos campos
    "PLR0917",
    "ANN401",   # los ayudantes reciben `**body: Any`: cuerpos JSON arbitrarios, mypy no revisa tests
    "FBT001",   # banderas booleanas en `parametrize` y en los ayudantes; se leen por la
    "FBT002",   # tabla de casos y por el nombre de la prueba
    "FBT003",   # `True`/`False` posicional al llamar al dominio: el caso lo deja a la vista
]
# Un endpoint de FastAPI recibe como parámetros el cuerpo, la sesión, la cuenta
# autenticada y cada dependencia (`Depends`): la inyección es el diseño del framework,
# no un exceso de argumentos que se pueda agrupar. Un `bool` con valor por omisión es
# una bandera de la cadena de consulta (`?include_inactive=true`), que FastAPI lee por nombre.
"src/resthub/modules/*/adapters/api/*.py" = ["PLR0913", "PLR0917", "FBT001", "FBT002"]
# alembic/ carga las migraciones por ruta de archivo; no son un paquete importable.
"alembic/**" = ["INP001"]
# chaos/ es el arnés de los experimentos de caos, que solo corre en local:
# - arranca y detiene procesos (uvicorn, PostgreSQL, Toxiproxy) con argumentos fijos
#   (S603, S607), usa directorios temporales propios (S108), elige fallas al azar sin
#   fines criptográficos (S311), arma SQL de prueba con identificadores propios (S608)
#   y a veces ignora un error al limpiar (S110);
# - ARG001: los diálogos comparten firma en una tabla de despacho; C901: son guiones
#   largos; TID251: lee el entorno a propósito;
# - ANN401/ANN201/ANN202: Playwright no se instala en el grupo `dev` y sus tipos
#   (`Page`, `Dialog`) no están disponibles para anotar; SLF001: los guiones comparten
#   `_page` y `_record` del arnés; PLC0415: Playwright se importa tarde para que el
#   resto del arnés funcione sin él; PLW0603: caché de los datos del escenario;
# - T201 e INP001: es un conjunto de guiones de línea de comandos, no un paquete.
"chaos/**" = [
    "S108", "S110", "S311", "S603", "S607", "S608",
    "ARG001", "C901", "TID251",
    "ANN201", "ANN202", "ANN401", "SLF001", "PLC0415", "PLW0603", "T201", "INP001",
    # Guiones largos con las esperas y los códigos HTTP de cada experimento a la vista.
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004",
    # Los ayudantes de la interfaz reciben banderas (`headless`, `slow`) por nombre en la llamada.
    "FBT001", "FBT002",
]
# Fuera de la aplicación el entorno se lee a propósito: los scripts de línea de comandos y
# el servidor que levanta la prueba de contrato.
"src/resthub/core/config.py" = ["TID251"]
# scripts/ son programas de línea de comandos: imprimen su resultado (T201), se ejecutan por
# ruta y no como paquete (INP001), y leen el entorno a propósito (TID251).
"scripts/**" = ["T201", "INP001", "TID251"]
# El verificador de Pact vuelca su informe con `print` para que pytest lo muestre con `-s`.
"tests/contract/test_provider_contract.py" = ["TID251", "T201"]
# Generador de datos de demostración: una función larga y lineal, no lógica de negocio.
# Las probabilidades y los umbrales del generador son parte de la receta de los datos.
"scripts/seed_history.py" = ["C901", "PLR0913", "PLR0917", "PLR2004"]

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["pydantic.field_validator"]

[tool.ruff.lint.mccabe]
max-complexity = 10

# Tope de 8 argumentos y 6 posicionales (el valor por omisión de Ruff es 5). Los
# constructores de casos de uso reciben un puerto por colaborador y eso es la
# inyección de dependencias hexagonal; más allá de 8 se agrupa en un objeto o se
# justifica con `noqa` en la línea.
[tool.ruff.lint.pylint]
max-args = 8
max-positional-args = 6

[tool.ruff.lint.flake8-tidy-imports]
# Las importaciones relativas cruzando paquetes esconden las dependencias que
# Import Linter debe poder ver, así que solo se permiten dentro de un módulo.
ban-relative-imports = "parents"

# La configuración entra por `resthub.core.config.Settings`; leer el entorno en
# otro sitio esconde una variable que nadie documenta ni valida.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"os.environ".msg = "Lee la configuración desde resthub.core.config.Settings."
"os.getenv".msg = "Lee la configuración desde resthub.core.config.Settings."

# Tipado estricto sobre el código de la aplicación. El plugin de Pydantic
# entiende los modelos (campos, validadores, `model_dump`) sin anotaciones extra.
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

# asyncpg no publica tipos (ni `py.typed`); sus usos están acotados a dos módulos del núcleo.
[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# Contratos de arquitectura hexagonal.
#
# Se verifican con `uv run lint-imports`. Import Linter construye el grafo real
# de importaciones, así que una violación falla aunque el nombre de la carpeta
# parezca correcto.
#
# Los cuatro usan comodines sobre `resthub.modules.*` en vez de nombrar los
# módulos uno por uno. Es deliberado: un módulo nuevo queda cubierto el día que
# se crea, sin que nadie tenga que acordarse de editar este archivo.
#
# Ninguno lleva excepciones. Los módulos de dominio cuelgan de `resthub.modules`
# justamente para eso: el núcleo compartido y la raíz de composición quedan
# fuera del comodín por estar en otro sitio del árbol, y no por estar exentos.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "resthub"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Capas hexagonales dentro de cada modulo"
type = "layers"
# El orden va de fuera hacia dentro. Una capa solo puede importar las que están
# por debajo de ella. Los paréntesis las hacen opcionales, para que el contrato
# valga también para un módulo que todavía no tenga las cuatro.
layers = [
    "(adapters)",
    "(use_cases)",
    "(ports)",
    "(domain)",
]
containers = [
    "resthub.modules.*",
]

[[tool.importlinter.contracts]]
name = "El dominio y los casos de uso no conocen la tecnologia"
type = "forbidden"
source_modules = [
    "resthub.modules.*.domain",
    "resthub.modules.*.ports",
    "resthub.modules.*.use_cases",
]
# La lista incluye toda dependencia de tercero del proyecto, no solo el ORM y
# el framework web. El dominio es Python puro: tampoco puede conocer Pydantic,
# ni la librería de cifrado, ni la de tokens.
forbidden_modules = [
    "alembic",
    "asyncpg",
    "bcrypt",
    "fastapi",
    "httpx",
    "jwt",
    "pydantic",
    "pydantic_settings",
    "sqlalchemy",
    "starlette",
    "structlog",
    "uvicorn",
    "resthub.core.auth",
    "resthub.core.database",
    "resthub.core.realtime_broker",
    "resthub.core.security",
    "resthub.core.tokens",
]

[[tool.importlinter.contracts]]
name = "Los modulos de dominio no se importan entre si"
type = "independence"
# `independence` es simétrico, a diferencia de `forbidden`: cubre las dos
# direcciones, así que un módulo nuevo tampoco puede importar a los que ya
# existían.
modules = [
    "resthub.modules.*",
]

[[tool.importlinter.contracts]]
name = "El nucleo compartido no depende de los modulos de dominio"
type = "forbidden"
source_modules = [
    "resthub.core",
]
forbidden_modules = [
    "resthub.modules.**",
]

[[tool.importlinter.contracts]]
name = "Los modulos no dependen de la raiz de composicion"
type = "forbidden"
# La raíz de composición (`main` y `wiring`) conoce a todos los módulos para
# conectarlos; al revés sería un ciclo, y un módulo que la importara estaría
# alcanzando a los demás por la puerta de atrás.
source_modules = [
    "resthub.modules",
]
forbidden_modules = [
    "resthub.main",
    "resthub.wiring",
]

[[tool.importlinter.contracts]]
name = "La API HTTP no construye adaptadores de persistencia (solo dependencies.py compone)"
type = "forbidden"
source_modules = [
    "resthub.modules.*.adapters.api",
]
forbidden_modules = [
    "resthub.modules.*.adapters.persistence",
]
ignore_imports = [
    "resthub.modules.*.adapters.api.dependencies -> resthub.modules.*.adapters.persistence.**",
]

[[tool.importlinter.contracts]]
name = "Persistencia sin web ni API del mismo modulo"
type = "forbidden"
# Solo importaciones directas: `core.database` importa fastapi para su
# dependencia de sesión, y eso no es culpa del adaptador.
allow_indirect_imports = true
source_modules = [
    "resthub.modules.*.adapters.persistence",
]
forbidden_modules = [
    "resthub.modules.*.adapters.api",
    "fastapi",
    "starlette",
    "pydantic",
]

[[tool.importlinter.contracts]]
name = "La API HTTP no habla con la base directamente"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "resthub.modules.*.adapters.api",
]
forbidden_modules = [
    "sqlalchemy",
    "asyncpg",
    "aiosqlite",
]

[[tool.importlinter.contracts]]
name = "Las capas internas solo usan el nucleo puro"
type = "forbidden"
# `core.permissions`, `core.pagination` y similares son núcleo puro y se
# aceptan; lo que no, es el núcleo con efectos (configuración, logs, telemetría,
# límites de tasa, IA, bitácora, tareas en segundo plano...).
allow_indirect_imports = true
source_modules = [
    "resthub.modules.*.domain",
    "resthub.modules.*.ports",
    "resthub.modules.*.use_cases",
]
forbidden_modules = [
    "resthub.core.config",
    "resthub.core.logs",
    "resthub.core.telemetry",
    "resthub.core.rate_limit",
    "resthub.core.login_throttle",
    "resthub.core.activity_log",
    "resthub.core.background",
    "logging",
]

[[tool.importlinter.contracts]]
name = "El dominio no usa stdlib con efectos"
type = "forbidden"
source_modules = [
    "resthub.modules.*.domain",
]
forbidden_modules = [
    "logging",
    "os",
    "sys",
    "asyncio",
    "threading",
    "random",
    "resthub.core.activity",
    "resthub.core.realtime",
    "resthub.core.identity",
    "resthub.core.cpu_bound",
]

[[tool.importlinter.contracts]]
name = "El nucleo no conoce la raiz de composicion"
type = "forbidden"
source_modules = [
    "resthub.core",
]
forbidden_modules = [
    "resthub.main",
    "resthub.wiring",
]
