[project]
name = "resthub-backend"
version = "0.1.0"
description = "Backend hexagonal de RestHub, gestión de restaurantes pequeños"
requires-python = ">=3.12,<3.15"
# `tzdata` trae la base de zonas horarias de IANA: `zoneinfo` la usa cuando el
# sistema no la tiene, como en Windows o en imágenes de contenedor mínimas.
dependencies = [
    "aiosqlite==0.22.1",
    "alembic==1.19.2",
    "asyncpg==0.31.0",
    "bcrypt==5.0.0",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "pydantic[email]==2.13.5",
    "pydantic-settings==2.15.0",
    "pyjwt==2.15.1",
    "sqlalchemy==2.0.52",
    "structlog==26.1.0",
    "tzdata==2026.4",
    "uvicorn[standard]==0.52.4",
]

[dependency-groups]
chaos = [
    "chaostoolkit>=1.20.0",
    "chaostoolkit-lib>=1.45.0",
    "playwright>=1.63.0",
]
dev = [
    "import-linter>=2.15",
    "mypy>=2.4",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.16,<0.17",
]
# Cobertura de código. Va aparte de `dev` para no alargar el CI:
# `uv run --group coverage pytest --cov=resthub --cov-report=term-missing`.
coverage = [
    "pytest-cov>=7.0",
]
# Pruebas de mutación (mutmut 3). Lentas: no corren en el CI de cada push.
# `uv run --group mutation mutmut run --max-children 3`.
mutation = [
    "mutmut>=3.3",
]
# Verificación del contrato con el frontend (Pact). Grupo aparte para no
# alargar el CI de las pruebas comunes: lo instala solo su job.
contract = [
    "pact-python>=3.4",
]
# Análisis estático de seguridad y de dependencias; lo usa el job `seguridad`
# del CI. Semgrep no va aquí: fija versiones propias de varias librerías, así
# que corre aparte con `uvx`.
security = [
    "bandit[toml]>=1.9",
    "pip-audit>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resthub"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
# Un aviso es un fallo. Es la forma barata de enterarse de una deprecación
# cuando todavía queda una versión de margen para atenderla.
filterwarnings = ["error"]

# SQLAlchemy asíncrono ejecuta las consultas en greenlets: sin `greenlet` en
# `concurrency`, coverage.py deja de registrar las líneas que siguen a un
# `await` sobre la base aunque sí se ejecuten, y la cobertura sale subestimada.
[tool.coverage.run]
source = ["resthub"]
branch = true
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = true

[tool.coverage.html]
directory = "htmlcov"

# Pruebas de mutación con mutmut 3: `uv run --group mutation mutmut run --max-children 3`.
# El alcance son las reglas de negocio puras (`domain` y `use_cases`) de los
# módulos con reglas críticas y la lógica de permisos; los adaptadores (HTTP y
# SQLAlchemy) quedan fuera porque sus mutantes se prueban mejor con las pruebas
# de integración y multiplican el tiempo sin medir reglas del negocio.
[tool.mutmut]
source_paths = ["src/"]
only_mutate = [
    "src/resthub/modules/orders/domain/*",
    "src/resthub/modules/orders/use_cases/*",
    "src/resthub/modules/billing/domain/*",
    "src/resthub/modules/billing/use_cases/*",
    "src/resthub/modules/inventory/domain/*",
    "src/resthub/modules/inventory/use_cases/*",
    "src/resthub/modules/accounts/domain/*",
    "src/resthub/modules/accounts/use_cases/*",
    "src/resthub/core/permissions.py",
]
also_copy = ["alembic/", "alembic.ini", "scripts/"]
pytest_add_cli_args = ["-p", "no:cacheprovider"]

# Bandit revisa el código que se ejecuta (`src` y `scripts`). Las pruebas quedan
# fuera: usan `assert` y credenciales de mentira por diseño. Ninguna regla se
# omite de forma global; cada falso positivo lleva `# nosec BXXX` en su línea.
[tool.bandit]
exclude_dirs = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
# ERA rechaza codigo comentado y FIX rechaza cualquier TODO o FIXME que quede
# en el arbol: una tarea pendiente vive en el gestor de incidencias, no en un
# comentario que nadie vuelve a leer.
#
# De pydocstyle se eligen solo las reglas de FORMA. Las que exigen la presencia
# de un docstring, D100 a D107, quedan fuera a proposito: obligar a documentar
# cada modulo y cada funcion es lo que produce la linea que repite el nombre del
# archivo. Aca un docstring es opcional, y cuando existe tiene que estar bien
# escrito.
select = [
    "A",
    "ARG",
    "B",
    "BLE",
    "C4",
    "C90",
    "D200",
    "D201",
    "D202",
    "D205",
    "D209",
    "D210",
    "D212",
    "D300",
    "D400",
    "D403",
    "D419",
    "E",
    "ERA",
    "F",
    "FIX",
    "FURB",
    "I",
    "ICN",
    "PERF",
    "PIE",
    "PTH",
    "Q",
    "RET",
    "RUF",
    "S",
    "SIM",
    "TID",
    "UP",
]

# S son las reglas de seguridad de flake8-bandit. En las pruebas se apagan solo
# tres, y por su naturaleza: pytest verifica con `assert` (S101) y las pruebas
# usan contraseñas y claves de mentira a propósito (S105, S106). Fuera de
# `tests/` todo falso positivo se suprime en su línea y con su motivo.
[tool.ruff.lint.per-file-ignores]
# ARG se apaga en tests: las fixtures de pytest se piden por el efecto, no por el valor.
"tests/**" = ["ARG", "S101", "S105", "S106"]
# chaos/ es el arnés de los experimentos de caos, que solo corre en local (ARG001: los diálogos
# comparten firma en una tabla de despacho; C901: son guiones largos): arranca
# y detiene procesos (uvicorn, PostgreSQL, Toxiproxy) con argumentos fijos, usa
# directorios temporales propios y elige fallas al azar sin fines criptográficos.
"chaos/**" = ["S108", "S110", "S311", "S603", "S607", "S608", "ARG001", "C901"]
# Generador de datos de demostración: una función larga y lineal, no lógica de negocio.
"scripts/seed_history.py" = ["C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-tidy-imports]
# Las importaciones relativas cruzando paquetes esconden las dependencias que
# Import Linter debe poder ver, así que solo se permiten dentro de un módulo.
ban-relative-imports = "parents"

# Tipado estricto sobre el código de la aplicación. El plugin de Pydantic
# entiende los modelos (campos, validadores, `model_dump`) sin anotaciones extra.
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

# asyncpg no publica tipos (ni `py.typed`); sus usos están acotados a dos módulos del núcleo.
[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# Contratos de arquitectura hexagonal.
#
# Se verifican con `uv run lint-imports`. Import Linter construye el grafo real
# de importaciones, así que una violación falla aunque el nombre de la carpeta
# parezca correcto.
#
# Los cuatro usan comodines sobre `resthub.modules.*` en vez de nombrar los
# módulos uno por uno. Es deliberado: un módulo nuevo queda cubierto el día que
# se crea, sin que nadie tenga que acordarse de editar este archivo.
#
# Ninguno lleva excepciones. Los módulos de dominio cuelgan de `resthub.modules`
# justamente para eso: el núcleo compartido y la raíz de composición quedan
# fuera del comodín por estar en otro sitio del árbol, y no por estar exentos.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "resthub"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Capas hexagonales dentro de cada modulo"
type = "layers"
# El orden va de fuera hacia dentro. Una capa solo puede importar las que están
# por debajo de ella. Los paréntesis las hacen opcionales, para que el contrato
# valga también para un módulo que todavía no tenga las cuatro.
layers = [
    "(adapters)",
    "(use_cases)",
    "(ports)",
    "(domain)",
]
containers = [
    "resthub.modules.*",
]

[[tool.importlinter.contracts]]
name = "El dominio y los casos de uso no conocen la tecnologia"
type = "forbidden"
source_modules = [
    "resthub.modules.*.domain",
    "resthub.modules.*.ports",
    "resthub.modules.*.use_cases",
]
# La lista incluye toda dependencia de tercero del proyecto, no solo el ORM y
# el framework web. El dominio es Python puro: tampoco puede conocer Pydantic,
# ni la librería de cifrado, ni la de tokens.
forbidden_modules = [
    "alembic",
    "asyncpg",
    "bcrypt",
    "fastapi",
    "httpx",
    "jwt",
    "pydantic",
    "pydantic_settings",
    "sqlalchemy",
    "starlette",
    "structlog",
    "uvicorn",
    "resthub.core.auth",
    "resthub.core.database",
    "resthub.core.realtime_broker",
    "resthub.core.security",
    "resthub.core.tokens",
]

[[tool.importlinter.contracts]]
name = "Los modulos de dominio no se importan entre si"
type = "independence"
# `independence` es simétrico, a diferencia de `forbidden`: cubre las dos
# direcciones, así que un módulo nuevo tampoco puede importar a los que ya
# existían.
modules = [
    "resthub.modules.*",
]

[[tool.importlinter.contracts]]
name = "El nucleo compartido no depende de los modulos de dominio"
type = "forbidden"
source_modules = [
    "resthub.core",
]
forbidden_modules = [
    "resthub.modules.**",
]

[[tool.importlinter.contracts]]
name = "Los modulos no dependen de la raiz de composicion"
type = "forbidden"
# La raíz de composición (`main` y `wiring`) conoce a todos los módulos para
# conectarlos; al revés sería un ciclo, y un módulo que la importara estaría
# alcanzando a los demás por la puerta de atrás.
source_modules = [
    "resthub.modules",
]
forbidden_modules = [
    "resthub.main",
    "resthub.wiring",
]

[[tool.importlinter.contracts]]
name = "La API HTTP no construye adaptadores de persistencia (solo dependencies.py compone)"
type = "forbidden"
source_modules = [
    "resthub.modules.*.adapters.api",
]
forbidden_modules = [
    "resthub.modules.*.adapters.persistence",
]
ignore_imports = [
    "resthub.modules.*.adapters.api.dependencies -> resthub.modules.*.adapters.persistence.**",
]

[[tool.importlinter.contracts]]
name = "Persistencia sin web ni API del mismo modulo"
type = "forbidden"
# Solo importaciones directas: `core.database` importa fastapi para su
# dependencia de sesión, y eso no es culpa del adaptador.
allow_indirect_imports = true
source_modules = [
    "resthub.modules.*.adapters.persistence",
]
forbidden_modules = [
    "resthub.modules.*.adapters.api",
    "fastapi",
    "starlette",
    "pydantic",
]

[[tool.importlinter.contracts]]
name = "La API HTTP no habla con la base directamente"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "resthub.modules.*.adapters.api",
]
forbidden_modules = [
    "sqlalchemy",
    "asyncpg",
    "aiosqlite",
]

[[tool.importlinter.contracts]]
name = "Las capas internas solo usan el nucleo puro"
type = "forbidden"
# `core.permissions`, `core.pagination` y similares son núcleo puro y se
# aceptan; lo que no, es el núcleo con efectos (configuración, logs, telemetría,
# límites de tasa, IA, bitácora, tareas en segundo plano...).
allow_indirect_imports = true
source_modules = [
    "resthub.modules.*.domain",
    "resthub.modules.*.ports",
    "resthub.modules.*.use_cases",
]
forbidden_modules = [
    "resthub.core.config",
    "resthub.core.logs",
    "resthub.core.telemetry",
    "resthub.core.rate_limit",
    "resthub.core.login_throttle",
    "resthub.core.activity_log",
    "resthub.core.background",
    "logging",
]

[[tool.importlinter.contracts]]
name = "El dominio no usa stdlib con efectos"
type = "forbidden"
source_modules = [
    "resthub.modules.*.domain",
]
forbidden_modules = [
    "logging",
    "os",
    "sys",
    "asyncio",
    "threading",
    "random",
    "resthub.core.activity",
    "resthub.core.realtime",
    "resthub.core.identity",
    "resthub.core.cpu_bound",
]

[[tool.importlinter.contracts]]
name = "El nucleo no conoce la raiz de composicion"
type = "forbidden"
source_modules = [
    "resthub.core",
]
forbidden_modules = [
    "resthub.main",
    "resthub.wiring",
]
