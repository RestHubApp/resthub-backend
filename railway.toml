# Configuración de Railway como código. Lo que se define acá pisa lo que se
# haya puesto en el panel del servicio.
# Referencia: https://docs.railway.com/reference/config-as-code

[build]
# El Dockerfile de la raíz, no Railpack: la misma imagen se construye y se
# prueba en local con `docker build`.
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Sin `startCommand`: el arranque (migraciones y uvicorn) lo define el `CMD`
# del Dockerfile, en un solo lugar.
# Railway no manda tráfico al despliegue nuevo hasta que este responde 200.
healthcheckPath = "/api/v1/health"
# Holgado: el arranque incluye `alembic upgrade head`.
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Virginia: la región de Railway más cercana a Perú (no hay en Sudamérica). La
# base (servicio Postgres) está en la misma región, así que cada consulta viaja
# por la red privada del mismo centro de datos.
[deploy.multiRegionConfig.us-east4-eqdc4a]
numReplicas = 1
