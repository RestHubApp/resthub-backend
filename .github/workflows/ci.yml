# Las mismas comprobaciones que los hooks locales, más las pruebas. El hook de
# Git es una comodidad y se puede saltar con --no-verify; esto no.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # El rango declarado en pyproject.toml, comprobado de punta a punta.
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sincronizar dependencias
        run: uv sync --locked --group dev

      - name: Ruff, reglas
        run: uv run ruff check .

      - name: Ruff, formato
        run: uv run ruff format --check .

      - name: Contratos de arquitectura hexagonal
        run: uv run lint-imports

      - name: Pruebas
        run: uv run pytest -q

  # Análisis estático de seguridad y de dependencias. Ruff ya corre las reglas S
  # en el job de arriba; este suma Bandit, pip-audit, Semgrep y gitleaks. Los detalles y
  # los falsos positivos revisados están en RestHub_Pruebas/07-seguridad/sast.md.
  seguridad:
    name: Seguridad (Bandit, pip-audit, Semgrep, gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # gitleaks revisa el historial completo, no solo el último commit.
          fetch-depth: 0

      - name: Instalar uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sincronizar el grupo security
        run: uv sync --locked --only-group security

      - name: Bandit
        run: uv run --locked --only-group security bandit -c pyproject.toml -r src scripts

      - name: pip-audit sobre uv.lock
        run: |
          uv export --locked --all-groups --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
          uv run --locked --only-group security pip-audit --strict --disable-pip \
            -r "$RUNNER_TEMP/requirements.txt"

      - name: Semgrep
        env:
          SEMGREP_SEND_METRICS: 'off'
        run: >
          uvx semgrep==1.178.0 scan --metrics=off --error
          --config p/python --config p/fastapi --config p/owasp-top-ten
          --config p/secrets --config p/jwt

      - name: gitleaks sobre el historial
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --log-opts=HEAD .
