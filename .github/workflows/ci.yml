# Las mismas comprobaciones que los hooks locales, más las pruebas. El hook de
# Git es una comodidad y se puede saltar con --no-verify; esto no.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # La cobertura se mide una sola vez, en 3.14: el código cubierto es el mismo en las tres
  # versiones y medirla hace la suite unas dos veces más lenta. 3.12 y 3.13 corren la
  # suite sin cobertura, cada una en una máquina.
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # El rango declarado en pyproject.toml, comprobado de punta a punta (3.14 va en
        # `backend-parte`).
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sincronizar dependencias
        run: uv sync --locked --group dev

      - name: Ruff, reglas
        run: uv run ruff check .

      - name: Ruff, formato
        run: uv run ruff format --check .

      - name: Contratos de arquitectura hexagonal
        run: uv run lint-imports

      - name: Tipos (mypy estricto)
        run: uv run mypy

      - name: Dependencias (deptry)
        # Declaradas sin uso, usadas sin declarar o que solo llegan de rebote.
        run: uv run deptry .

      - name: Pruebas
        # `-n auto` reparte la suite entre los núcleos del runner y pytest-randomly
        # baraja el orden en cada corrida (la semilla sale en la cabecera del informe;
        # para repetir una falla: `pytest -p randomly --randomly-seed=<semilla>`).
        run: uv run pytest -q -n auto

  # 3.14, con cobertura, en dos máquinas (`RESTHUB_TEST_SHARD`, ver `tests/conftest.py`).
  # Cada parte guarda su cobertura y `backend-cobertura` la junta y aplica `fail_under`
  # sobre el total.
  backend-parte:
    name: Backend (Python 3.14, parte ${{ matrix.parte }} de 2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        parte: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sincronizar dependencias
        run: uv sync --locked --group dev --group coverage

      # Las revisiones estáticas no dependen de la parte: van solo en la primera.
      - name: Ruff, reglas
        if: ${{ matrix.parte == 1 }}
        run: uv run ruff check .

      - name: Ruff, formato
        if: ${{ matrix.parte == 1 }}
        run: uv run ruff format --check .

      - name: Contratos de arquitectura hexagonal
        if: ${{ matrix.parte == 1 }}
        run: uv run lint-imports

      - name: Tipos (mypy estricto)
        if: ${{ matrix.parte == 1 }}
        run: uv run mypy

      - name: Dependencias (deptry)
        if: ${{ matrix.parte == 1 }}
        run: uv run deptry .

      - name: Pruebas con cobertura (su parte)
        # Para repetir una falla: `RESTHUB_TEST_SHARD=<parte>/2 pytest -p randomly
        # --randomly-seed=<semilla>`. `fail_under` se mide en `backend-cobertura`.
        env:
          RESTHUB_TEST_SHARD: ${{ matrix.parte }}/2
        run: |
          uv run pytest -q -n auto --cov=resthub --cov-report= --cov-fail-under=0
          mv .coverage .coverage.parte-${{ matrix.parte }}

      - name: Guardar la cobertura
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cobertura-parte-${{ matrix.parte }}
          path: .coverage.parte-${{ matrix.parte }}
          include-hidden-files: true
          retention-days: 3

  backend-cobertura:
    name: Backend (Python 3.14)
    runs-on: ubuntu-latest
    needs: backend-parte
    if: ${{ !cancelled() }}
    steps:
      - name: Las dos partes pasaron
        if: ${{ needs.backend-parte.result != 'success' }}
        run: |
          echo "::error::Alguna parte de las pruebas falló (${{ needs.backend-parte.result }}): mira su job."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sincronizar dependencias
        run: uv sync --locked --group coverage

      - name: Bajar la cobertura de las partes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cobertura-parte-*
          merge-multiple: true

      - name: Cobertura total (falla por debajo de fail_under)
        run: |
          uv run coverage combine
          uv run coverage report

  # La misma suite contra PostgreSQL 17, como en producción (asyncpg). Los jobs de arriba
  # usan SQLite en memoria: no ven tipos, bloqueos ni SQL propios de PostgreSQL. Aquí
  # se corren primero las migraciones de Alembic (y se comprueba que no haya deriva
  # contra el modelo) y después las pruebas: cada worker de xdist crea su propio
  # esquema en esta base (ver `tests/conftest.py`).
  postgres-parte:
    name: Backend sobre PostgreSQL 17 (parte ${{ matrix.parte }} de 2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        parte: [1, 2]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: resthub
          POSTGRES_PASSWORD: resthub
          POSTGRES_DB: resthub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resthub -d resthub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # `DEBUG` está apagado por omisión: las migraciones de este job corren con la clave y
      # la llave de desarrollo, que solo se admiten en depuración.
      DEBUG: 'true'
      DATABASE_URL: postgresql+asyncpg://resthub:resthub@localhost:5432/resthub
      RESTHUB_TEST_DATABASE_URL: postgresql+asyncpg://resthub:resthub@localhost:5432/resthub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sincronizar dependencias
        run: uv sync --locked --group dev

      - name: Migraciones de Alembic sobre PostgreSQL
        run: uv run alembic upgrade head

      - name: Deriva entre el modelo y las migraciones
        if: ${{ matrix.parte == 1 }}
        run: uv run alembic check

      - name: Pruebas contra PostgreSQL (su parte)
        env:
          RESTHUB_TEST_SHARD: ${{ matrix.parte }}/2
        run: uv run pytest -q -n auto

  # El nombre de siempre, para la protección de la rama: falla si alguna parte falló.
  postgres:
    name: Backend sobre PostgreSQL 17
    runs-on: ubuntu-latest
    needs: postgres-parte
    if: ${{ !cancelled() }}
    steps:
      - name: Las dos partes pasaron
        if: ${{ needs.postgres-parte.result != 'success' }}
        run: |
          echo "::error::Alguna parte de las pruebas sobre PostgreSQL falló (${{ needs.postgres-parte.result }}): mira su job."
          exit 1

  # Fuzzing de la API desde su OpenAPI (Schemathesis): respuestas 500 y respuestas que no
  # cumplen el esquema declarado. Levanta la aplicación real con `scripts/fuzz_api.sh` (SQLite
  # migrada y sembrada, DEBUG para publicar el esquema, sesión del encargado y de la
  # plataforma). Bloquea la integración: una respuesta 500 o fuera de esquema es un fallo.
  # Va en tres máquinas (`FUZZ_SCOPE`): la API del local en dos mitades y `/platform`.
  api-fuzzing-parte:
    name: Fuzzing de la API (Schemathesis, ${{ matrix.scope }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scope: [operacion, gestion, plataforma]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sincronizar dependencias
        run: uv sync --locked --group fuzz

      - name: Schemathesis contra la API levantada
        env:
          FUZZ_SCOPE: ${{ matrix.scope }}
        run: uv run --locked --group fuzz bash scripts/fuzz_api.sh 25

  # El nombre de siempre, para la protección de la rama: falla si alguna parte falló.
  api-fuzzing:
    name: Fuzzing de la API (Schemathesis)
    runs-on: ubuntu-latest
    needs: api-fuzzing-parte
    if: ${{ !cancelled() }}
    steps:
      - name: Las tres partes pasaron
        if: ${{ needs.api-fuzzing-parte.result != 'success' }}
        run: |
          echo "::error::Alguna parte del fuzzing falló (${{ needs.api-fuzzing-parte.result }}): mira su job."
          exit 1

  # Código repetido: falla si más del 1 % de `src` son clones (hoy, 0,25 %).
  # La configuración está en .jscpd.json.
  duplicados:
    name: Código repetido (jscpd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: jscpd con umbral del 1 %
        run: npx --yes jscpd@4.0.5 -c .jscpd.json

  # Análisis estático de seguridad y de dependencias. Ruff ya corre las reglas S
  # en el job de arriba; este suma Bandit, pip-audit, Semgrep y gitleaks. Los detalles y
  # los falsos positivos revisados están en RestHub_Pruebas/07-seguridad/sast.md.
  seguridad:
    name: Seguridad (Bandit, pip-audit, Semgrep, gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks revisa el historial completo, no solo el último commit.
          fetch-depth: 0

      - name: Instalar uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sincronizar el grupo security
        run: uv sync --locked --only-group security

      - name: Bandit
        run: uv run --locked --only-group security bandit -c pyproject.toml -r src scripts

      - name: pip-audit sobre uv.lock
        run: |
          uv export --locked --all-groups --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
          uv run --locked --only-group security pip-audit --strict --disable-pip \
            -r "$RUNNER_TEMP/requirements.txt"

      - name: Semgrep
        env:
          SEMGREP_SEND_METRICS: 'off'
        run: >
          uvx semgrep==1.178.0 scan --metrics=off --error
          --config p/python --config p/fastapi --config p/owasp-top-ten
          --config p/secrets --config p/jwt

      - name: gitleaks sobre el historial
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --log-opts=HEAD .

  # El contrato con el frontend: el pact que generan sus pruebas de consumidor
  # (tests/contract/pacts/) se reproduce contra la aplicación real, levantada
  # con la ruta de estados de prueba en el puerto 8203 sobre una SQLite nueva.
  # Si el backend deja de devolver un campo que el frontend usa, o cambia su
  # tipo o su formato, este job falla.
  contract:
    name: Contrato con el frontend (Pact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sincronizar dependencias
        run: uv sync --locked --group dev --group contract

      - name: Verificar el contrato del frontend
        run: uv run pytest tests/contract -v -s -p no:logging
